{% extends "base.html" %}

{% block auth_content %}
<div class="login-wrapper animate-fade-in">
    <div class="login-card glass">
        <!-- Cabeçalho -->
        <div class="login-header">
            <div class="logo-container">
                <h1 class="logo-text">Nova <span class="accent-text">Senha</span></h1>
            </div>
            <p class="login-subtitle">Escolha e confirme sua nova senha de acesso.</p>
        </div>

        <!-- Alertas de Erro -->
        {% if error %}
        <div class="alert-box alert-error animate-shake">
            <div class="alert-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <div class="alert-content">
                <strong>Erro</strong>
                <p>{{ error }}</p>
            </div>
        </div>
        {% endif %}

        {% if valid %}
        <!-- Formulário de Reset -->
        <form action="{{ request.url }}" method="POST" class="login-form">
            <div class="form-group">
                <label for="password" class="form-label">Nova Senha</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirmar Nova Senha</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-login">
                <span>Salvar Nova Senha</span>
                <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
        {% endif %}

        <div style="text-align: center; margin-top: 25px;">
            <a href="{{ url_for('login') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: var(--transition-smooth);" onmouseover="this.style.color='var(--text-main)'" onmouseout="this.style.color='var(--text-muted)'">Voltar para o Login</a>
        </div>

        <div class="login-footer">
            <p>Controle de Acesso Centralizado • <strong>db_flow_admin</strong></p>
        </div>
    </div>
</div>
{% endblock %}
